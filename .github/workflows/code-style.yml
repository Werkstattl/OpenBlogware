name: Code Style

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cs:
    name: Code Format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run CS
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: format

  ludtwig:
    name: Twig Lint (Storefront)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ludtwig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MalteJanz/ludtwig --pattern '*unknown-linux-gnu.tar.gz' && tar xf *.tar.gz
          mv ./ludtwig /usr/local/bin

      - name: Run ludtwig linter
        run: |
          cd ./src/Resources/views
          ludtwig .

  check:
    name: Extension Validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version-selection:
          - lowest
          - highest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Check
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: check
          check-against: ${{ matrix.version-selection }}
