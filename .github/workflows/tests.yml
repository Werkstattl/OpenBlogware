name: Tests
on:
  pull_request:
    paths:
      - '**/*.php'
  push:
    branches:
      - main
    paths:
      - '**/*.php'
  workflow_dispatch:

jobs:
  phpunit:
    uses: shopware/github-actions/.github/workflows/phpunit.yml@main
    with:
      extensionName: WerklOpenBlogware
      shopwareVersion: 6.7.x
